server:
  port: 8081

spring:
  application:
    name: user-auth
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_auth}
    username: ${DB_USERNAME:user_auth}
    password: ${DB_PASSWORD:user_auth}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  auth:
    jwt:
      issuer: qgames-user-auth
      key-id: ${JWT_KEY_ID:dev-key-1}
      private-key: ${JWT_PRIVATE_KEY_LOCATION:file:../../docker/dev-keys/jwt-private.pem}
      public-key: ${JWT_PUBLIC_KEY_LOCATION:file:../../docker/dev-keys/jwt-public.pem}
      access-token-ttl: 15m
    refresh-token-ttl: 30d
    refresh-reuse-grace: 10s
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
