server:
  port: 8080

spring:
  application:
    name: user-gateway
  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      user-auth:
        base-url: ${USER_AUTH_URL:http://localhost:8081}
      game:
        base-url: ${GAME_URL:http://localhost:8082}
      # Поток событий комнаты (SSE): без read-timeout, соединение живёт, пока открыт поток.
      game-stream:
        base-url: ${GAME_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  gateway:
    jwt:
      jwk-set-uri: ${USER_AUTH_URL:http://localhost:8081}/.well-known/jwks.json
      issuer: qgames-user-auth
    cors:
      # Точные origin фронта через запятую, без wildcard. В проде — https://qgames.site.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    cookies:
      # Браузеры считают localhost безопасным контекстом, поэтому Secure-куки работают и по http://localhost.
      secure: ${COOKIES_SECURE:true}
