# Значения по умолчанию для всех сервисов; сервис может переопределить их в application.yml.
# Успешные ответы — JSON (а не */*): иначе генераторы клиентов (Orval) не строят схемы ответов.
springdoc.default-produces-media-type=application/json
# Ключи OpenAPI (пути, схемы, ответы) — по алфавиту: иначе springdoc отдаёт их в нестабильном порядке,
# и снапшот API на фронте меняется без изменения контракта.
springdoc.writer-with-order-by-keys=true
