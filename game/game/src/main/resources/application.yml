server:
  port: 8082

spring:
  application:
    name: game
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/game}
    username: ${DB_USERNAME:game}
    password: ${DB_PASSWORD:game}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    # Остальные настройки потребителя CDC — по умолчанию из libs/common-cdc-consumer.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  game:
    catalog:
      # Как часто отменять партии и удалять комнаты принудительно отключённых игр (ForceDisabledGameCleanupJob).
      force-disabled-cleanup-interval: 1m
      force-disabled-cleanup-enabled: true
    room:
      # Комната без игроков и наблюдателей удаляется, когда пустует дольше этого времени.
      empty-ttl: ${ROOM_EMPTY_TTL:30m}
      cleanup-interval: 1m
      cleanup-enabled: true
      # Выход отложенный: столько вышедший участник ещё числится в комнате и может вернуться без потери роли и
      # владения. Игрокам идущей партии срок задаёт игра (GameRules.reconnectGrace).
      # Создатель комнаты получает срок owner сразу: если он так и не подключится к потоку комнаты, RoomLeaveJob его удалит.
      leave-grace:
        owner: 15s
        member: 1s
      # Как часто удалять участников с истёкшим сроком выхода (RoomLeaveJob).
      leave-check-interval: 1s
      leave-enabled: true
      # Подключения к потоку событий комнаты (SSE). Открытый поток — это нахождение в комнате.
      connection:
        # Аренда подключения: инстанс продлевает её каждые heartbeat-interval. Если инстанс упал, через lease его
        # подключения удаляются (RoomConnectionCleanupJob), а пользователи уходят из комнат, как при закрытии потока.
        # Аренда — 4 интервала пульса: живое подключение не истечёт, даже если пара продлений задержится.
        lease: 20s
        # Комментарий ": ping" во все потоки и продление аренды (RoomConnectionHeartbeatJob). По неудачной записи ping
        # замечается обрыв клиента, поэтому интервал определяет, как быстро уходит закрывший вкладку пользователь.
        heartbeat-interval: 5s
        heartbeat-enabled: true
        cleanup-interval: 5s
        cleanup-enabled: true
    session:
      # Как часто искать партии с истёкшим временем хода (MoveTimeoutJob).
      timeout-check-interval: 1s
      timeout-enabled: true
      # Кеш состояний партий по проекциям зрителей (SessionStateCache): по закешированному состоянию на seq K
      # доигрываются только события K+1…N. Потеря записи безопасна — состояние соберётся из журнала.
      state-cache:
        max-size: 10000
        expire-after-access: 30m
