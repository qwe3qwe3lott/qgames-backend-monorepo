server:
  port: 8082

spring:
  application:
    name: game
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/game}
    username: ${DB_USERNAME:game}
    password: ${DB_PASSWORD:game}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    # Остальные настройки потребителя CDC — по умолчанию из libs/common-cdc-consumer.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  game:
    room:
      # Комната без игроков и наблюдателей удаляется, когда пустует дольше этого времени.
      empty-ttl: ${ROOM_EMPTY_TTL:30m}
      cleanup-interval: 1m
      cleanup-enabled: true
