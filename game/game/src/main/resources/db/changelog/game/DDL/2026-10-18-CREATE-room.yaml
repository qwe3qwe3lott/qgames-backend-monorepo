databaseChangeLog:
  - changeSet:
      id: 2026-10-18-CREATE-room
      author: A Kozlov
      runInTransaction: true
      comment: >-
        Игровые комнаты. owner_id NULL — у комнаты нет владельца: в комнате никого нет (владельцем станет первый
        вошедший). current_session_id — идущая партия (без FK: room_session ссылается на room). empty_since — с какого момента в комнате
        нет присутствующих участников (автоудаление). settings — настройки комнаты: {"room": {"maxSpectators"}, "simple":
        simple-настройки игры или null (advanced-режим), "advanced": advanced-настройки игры, с ними стартует следующая
        партия}; формат simple и advanced задаёт модуль игры. event_seq — seq последнего события потока комнаты
        (растёт в транзакции изменения под блокировкой комнаты, снапшот потока несёт его).
      changes:
        - createTable:
            tableName: room
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: room_pk
              - column:
                  name: game_code
                  type: varchar(32)
                  constraints:
                    nullable: false
                    foreignKeyName: room_game_fk
                    referencedTableName: game
                    referencedColumnNames: code
              - column:
                  name: owner_id
                  type: uuid
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: current_session_id
                  type: uuid
              - column:
                  name: empty_since
                  type: timestamp with time zone
              - column:
                  name: settings
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: event_seq
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: room
            indexName: room_empty_since_idx
            columns:
              - column:
                  name: empty_since
        - createIndex:
            tableName: room
            indexName: room_game_code_idx
            columns:
              - column:
                  name: game_code
