qgames:
  game:
    # Шедулеры в тестах выключены: ForceDisabledGameCleanupJob, EmptyRoomCleanupJob, RoomOwnerGraceJob и MoveTimeoutJob
    # вызываются напрямую.
    catalog:
      force-disabled-cleanup-enabled: false
    room:
      cleanup-enabled: false
      owner-grace-enabled: false
      connection:
        heartbeat-enabled: false
        cleanup-enabled: false
    session:
      timeout-enabled: false
