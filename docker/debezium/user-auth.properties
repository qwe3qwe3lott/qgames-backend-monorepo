# Debezium Server: CDC из БД user_auth (таблица outbox_event) в Redpanda.
# Один Debezium Server на одну БД-источник. Правила — CLAUDE.md, раздел «Данные» (CDC).

# --- Sink: Redpanda (протокол Kafka). Ключ — aggregate_id, значение — сырые байты protobuf из outbox_event.payload.
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=redpanda:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.acks=all
debezium.format.key=simplestring
debezium.format.value=binary

# --- Source: PostgreSQL, logical replication (pgoutput). Публикацию qgames_outbox создаёт миграция user-auth.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/user-auth-offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=user_auth
debezium.source.database.password=user_auth
debezium.source.database.dbname=user_auth
debezium.source.topic.prefix=user-auth
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=qgames_outbox
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=debezium_user_auth
debezium.source.table.include.list=public.outbox_event
# Outbox не снапшотим: события нужны только из WAL, строки всё равно сразу удаляются.
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false

# --- Outbox Event Router: топик outbox.event.<aggregate_type>, ключ aggregate_id, значение payload.
# Свой шаблон имени топика задать нельзя: Quarkus-конфиг пытается подставить ${routedByValue} сам.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.type=event_type
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.route.by.field=aggregate_type
# DELETE строк outbox (insert+delete в одной транзакции) не публикуется.
debezium.transforms.outbox.table.op.invalid.behavior=warn

quarkus.log.level=INFO
quarkus.log.console.json=false
