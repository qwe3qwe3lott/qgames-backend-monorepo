# Локальный запуск всего проекта: docker compose up --build -d --wait
# Наружу публикуются приложение (8080: API портала и админки, Swagger) и PostgreSQL (5432) для IDE.

services:
  # Одна роль и одна БД приложения создаются самим образом из POSTGRES_USER/POSTGRES_DB при первом запуске на пустом томе.
  # Настройки — под малую память (VPS 1 ГБ, один инстанс приложения с маленьким пулом), обоснование — CLAUDE.md §10.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: qgames
      POSTGRES_PASSWORD: qgames
      POSTGRES_DB: qgames
    command:
      - postgres
      # Пул приложения (5) + соединение LISTEN + миграции, psql и запас.
      - -c
      - max_connections=20
      - -c
      - shared_buffers=16MB
      - -c
      - effective_cache_size=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - wal_buffers=1MB
      - -c
      - max_wal_size=64MB
      - -c
      - jit=off
      - -c
      - huge_pages=off
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - autovacuum_max_workers=1
    mem_limit: 128m
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgames -d qgames"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Модульный монолит: модули user-auth, admin-auth, game в одном процессе.
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/qgames
      DB_USERNAME: qgames
      DB_PASSWORD: qgames
      # Ключи подписи JWT игроков (user-auth) и администраторов (admin-auth) — разные.
      JWT_KEY_ID: dev-key-1
      JWT_PRIVATE_KEY_LOCATION: file:/keys/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      ADMIN_JWT_KEY_ID: admin-dev-key-1
      ADMIN_JWT_PRIVATE_KEY_LOCATION: file:/keys/admin-jwt-private.pem
      ADMIN_JWT_PUBLIC_KEY_LOCATION: file:/keys/admin-jwt-public.pem
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Первый администратор: создаётся при старте, только если администраторов ещё нет. Только для локального стенда.
      ADMIN_BOOTSTRAP_LOGIN: admin
      ADMIN_BOOTSTRAP_PASSWORD: admin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    volumes:
      - ./docker/dev-keys:/keys:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
