server:
  port: 8084

spring:
  application:
    name: admin-auth
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_auth}
    username: ${DB_USERNAME:admin_auth}
    password: ${DB_PASSWORD:admin_auth}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  admin-auth:
    jwt:
      issuer: qgames-admin-auth
      key-id: ${JWT_KEY_ID:admin-dev-key-1}
      private-key: ${JWT_PRIVATE_KEY_LOCATION:file:../../docker/dev-keys/admin-jwt-private.pem}
      public-key: ${JWT_PUBLIC_KEY_LOCATION:file:../../docker/dev-keys/admin-jwt-public.pem}
      access-token-ttl: 5m
    # Скользящий: каждая ротация выдаёт refresh-токен на полный срок.
    refresh-token-ttl: 15m
    refresh-reuse-grace: 10s
    # Первый администратор. Значений по умолчанию нет: без env бутстрап выключен (docker-compose задаёт admin/admin).
    bootstrap:
      login: ${ADMIN_BOOTSTRAP_LOGIN:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
