server:
  port: 8083

spring:
  application:
    name: admin-gateway
  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      admin-auth:
        base-url: ${ADMIN_AUTH_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qgames:
  gateway:
    jwt:
      jwk-set-uri: ${ADMIN_AUTH_URL:http://localhost:8084}/.well-known/jwks.json
      issuer: qgames-admin-auth
    cors:
      # Точные origin админки через запятую, без wildcard. Портал (3000) сюда не добавляется.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
    cookies:
      # Имена кук по умолчанию — admin_access_token / admin_refresh_token (см. GatewayProperties.Cookies).
      # Браузеры считают localhost безопасным контекстом, поэтому Secure-куки работают и по http://localhost.
      secure: ${COOKIES_SECURE:true}
